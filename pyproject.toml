[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-desktop"
version = "0.3.0"
description = "An unofficial, simulator-first desktop companion for Cozmo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "docs/licenses/*.txt"]
authors = [{name = "Cozmo Desktop contributors"}]
dependencies = ["PySide6>=6.8,<6.9", "qasync>=0.27,<0.29", "Pillow>=10.4,<13"]

[project.optional-dependencies]
direct = ["pycozmo==0.8.0", "numpy>=1.26,<2; python_version<'3.13'", "numpy>=2.1,<3; python_version>='3.13'", "flatbuffers>=24,<26", "dpkt==1.9.8"]
voice = ["vosk>=0.3.45,<1", "sounddevice>=0.4.6,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[project.gui-scripts]
cozmo-desktop = "cozmo_desktop.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["qasync", "pycozmo", "pycozmo.*", "sounddevice", "vosk"]
ignore_missing_imports = true
